# Authored by Tomás Neto (TN 2026)
# Keeps the SHA-pinned actions (and npm deps) up to date with reviewable PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
