# End-to-end (Playwright) against the real app: builds backend + admin UI, applies migrations, then in
# ONE step boots the API and the worker and runs the browser tests — a process backgrounded in one
# step does not survive into the next on act_runner. Runs on every PR, pushes to master, and on demand.
name: E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mailgw
          POSTGRES_PASSWORD: mailgw
          POSTGRES_DB: mailgw_e2e
        options: >-
          --health-cmd "pg_isready -U mailgw -d mailgw_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
      mailpit:
        image: axllent/mailpit:v1.33.1
    env:
      # app configuration (same variables as docker-compose / .env)
      NODE_ENV: production
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://mailgw:mailgw@postgres:5432/mailgw_e2e
      REDIS_URL: redis://redis:6379
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: "1025"
      PORT: "3000"
      COOKIE_SECURE: "false"
      APP_ENCRYPTION_KEY: ZTJlLWNpLW9ubHktbm90LWEtcmVhbC1zZWNyZXQtMDA=  # 32 bytes, CI-only test value
      METRICS_PORT: "9464"
      # Playwright
      MG_BASE_URL: http://127.0.0.1:3000
      MG_CLI: node dist/cli.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build backend + UI
        run: |
          npm run build
          npm run build -w ui

      - name: Migrate database
        run: npx prisma migrate deploy

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E (api + worker + tests in one step)
        run: |
          node dist/main.api.js > /tmp/api.log 2>&1 &
          METRICS_PORT=9465 node dist/main.worker.js > /tmp/worker.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health/ready >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/health/ready
          npx playwright test -c ui/playwright.config.ts

      - name: Server logs
        if: failure()
        run: |
          echo "----- api -----"; tail -n 200 /tmp/api.log || true
          echo "----- worker -----"; tail -n 200 /tmp/worker.log || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-results
          path: ui/test-results
          retention-days: 7
