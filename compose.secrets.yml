# Authored by Tomás Neto (TN 2026)
# Production overlay using Docker secrets (*_FILE variables).
#   docker compose -f docker-compose.yml -f compose.secrets.yml up -d
# Create the files under ./secrets first (see README "Secrets").
services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_PASSWORD: ""
    secrets: [postgres_password]
  migrate:
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_URL: ""
    secrets: [database_url]
  api:
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_URL: ""
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      RESEND_WEBHOOK_SECRET_FILE: /run/secrets/resend_webhook_secret
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
    secrets: [database_url, admin_token, resend_webhook_secret, app_encryption_key]
  worker:
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_URL: ""
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
    secrets: [database_url, smtp_password, resend_api_key]

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  admin_token:
    file: ./secrets/admin_token
  smtp_password:
    file: ./secrets/smtp_password
  resend_api_key:
    file: ./secrets/resend_api_key
  resend_webhook_secret:
    file: ./secrets/resend_webhook_secret
  app_encryption_key:
    file: ./secrets/app_encryption_key
