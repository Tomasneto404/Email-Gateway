# mail-gateway stack. Production: `docker compose -f docker-compose.yml up -d`
# (compose.override.yml is for local development only and is auto-loaded by `docker compose up`).
name: mail-gateway

x-app: &app
  # Registry image (e.g. registry.example.com/infra/mail-gateway) or the local build name.
  image: ${MAIL_GATEWAY_IMAGE:-mail-gateway}:${MAIL_GATEWAY_TAG:-latest}
  build:
    context: .
    target: runtime
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  env_file:
    - path: .env
      required: false
  networks: [internal]

x-common-env: &common-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-mailgw}:${POSTGRES_PASSWORD:-mailgw-dev-password}@postgres:5432/${POSTGRES_DB:-mailgw}
  REDIS_URL: redis://redis:6379
  MAILPIT_SMTP_HOST: mailpit
  MAILPIT_SMTP_PORT: "1025"
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailgw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailgw-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-mailgw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; AOF keeps quotas/dedup/queue across restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpitdata:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  migrate:
    build:
      context: .
      target: migrate
    image: ${MAIL_GATEWAY_IMAGE:-mail-gateway}:${MAIL_GATEWAY_TAG:-latest}-migrate
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mailgw}:${POSTGRES_PASSWORD:-mailgw-dev-password}@postgres:5432/${POSTGRES_DB:-mailgw}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    <<: *app
    command: ["node", "dist/main.api.js"]
    environment:
      <<: *common-env
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["node", "dist/main.worker.js"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9464/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  mailpitdata:

networks:
  internal:
    ipam:
      config:
        # Pin a subnet that doesn't overlap VPN/LAN routes on the host (an overlap makes
        # published ports hang and breaks outbound connections such as SMTP).
        - subnet: ${MAIL_GATEWAY_SUBNET:-10.213.7.0/24}
